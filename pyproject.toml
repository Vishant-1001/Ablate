[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ablate"
version = "0.1.0"
description = "Transactional MCP staging proxy, invariant gate and Reverse-Saga rollback for AI agents"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
  "httpx>=0.27",
  "google-adk>=1.0",
]

[tool.setuptools]
packages = ["ablate_tx", "services", "agent"]
